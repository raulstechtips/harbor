{{- range $feature := list "adminSecret" "secretKey" "registrySecret" "s3Secret" }}
{{- $secret := index $.Values $feature }}
{{- if $secret.enabled }}
{{- $data := dict }}
{{- range $key, $source := $secret.keys }}
{{- $_ := set $data $key (printf "{{ .%s.Value }}" $source) }}
{{- end }}
---
{{ include "harbor-wrapper.secret" (dict "root" $ "secret" $secret "feature" $feature "data" $data) }}
{{- end }}
{{- end }}

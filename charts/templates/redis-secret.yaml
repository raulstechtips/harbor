{{- /*
Harbor builds its Redis URLs with "lookup" when redis.external.existingSecret is set.
Argo CD renders without cluster access, so those URLs have no password. This Secret
holds the full URLs; core and jobservice read them through extraEnvVars, which win
over the same keys from the ConfigMaps. The registry reads REDIS_PASSWORD directly.
*/}}
{{- if .Values.redisSecret.enabled }}
{{- $redis := (index .Subcharts "harbor").Values.redis.external }}
{{- $base := printf "redis://:{{ .%s.Value | urlquery }}@%s" .Values.redisSecret.passwordKey $redis.addr }}
{{- $data := dict
  "REDIS_PASSWORD" (printf "{{ .%s.Value }}" .Values.redisSecret.passwordKey)
  "_REDIS_URL_CORE" (printf "%s/%s?idle_timeout_seconds=30" $base $redis.coreDatabaseIndex)
  "_REDIS_URL_REG" (printf "%s/%s?idle_timeout_seconds=30" $base $redis.registryDatabaseIndex)
  "JOB_SERVICE_POOL_REDIS_URL" (printf "%s/%s" $base $redis.jobserviceDatabaseIndex) }}
{{ include "harbor-wrapper.secret" (dict "root" . "secret" .Values.redisSecret "feature" "redisSecret" "data" $data) }}
{{- end }}

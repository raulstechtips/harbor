suite: Redis password and URL secret
templates:
  - templates/redis-secret.yaml
release:
  name: harbor
  namespace: harbor
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: builds the password and every Redis URL from one Infisical key
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: harbor-redis-secret
      - equal:
          path: spec.sources[0]
          value:
            projectSlug: fake-project
            environmentSlug: fake-env
            secretPath: /harbor/redis
            recursive: true
      - equal:
          path: spec.targets[0].creationPolicy
          value: Orphan
      - equal:
          path: spec.targets[0].template.data
          value:
            REDIS_PASSWORD: "{{ .HARBOR_REDIS_PASSWORD.Value }}"
            _REDIS_URL_CORE: "redis://:{{ .HARBOR_REDIS_PASSWORD.Value | urlquery }}@harbor-redis:6379/0?idle_timeout_seconds=30"
            _REDIS_URL_REG: "redis://:{{ .HARBOR_REDIS_PASSWORD.Value | urlquery }}@harbor-redis:6379/2?idle_timeout_seconds=30"
            JOB_SERVICE_POOL_REDIS_URL: "redis://:{{ .HARBOR_REDIS_PASSWORD.Value | urlquery }}@harbor-redis:6379/1"
  - it: requires the Infisical connection
    values:
      - ../ci/all-on-values.yaml
    set:
      adminSecret.enabled: false
      secretKey.enabled: false
      registrySecret.enabled: false
      s3Secret.enabled: false
      infisical.projectSlug: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.projectSlug is required when redisSecret is enabled

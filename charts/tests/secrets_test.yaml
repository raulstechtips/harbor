suite: Infisical secret mappings
templates:
  - templates/secrets.yaml
release:
  name: harbor
  namespace: harbor
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders one StaticSecret per enabled mapping
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - hasDocuments:
          count: 4
  - it: preserves the adminSecret target, source, keys and orphan policy
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: harbor-admin-credentials-secret
      - equal:
          path: spec.targets[0]
          value:
            name: harbor-admin-credentials-secret
            namespace: harbor
            kind: Secret
            secretType: Opaque
            creationPolicy: Orphan
            metadata:
              labels: {}
              annotations: {}
            template:
              engineVersion: v1
              data:
                HARBOR_ADMIN_PASSWORD: "{{ .HARBOR_ADMIN_PASSWORD.Value }}"
      - equal:
          path: spec.sources[0]
          value:
            projectSlug: fake-project
            environmentSlug: fake-env
            secretPath: /harbor/app
            recursive: true
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
  - it: preserves the secretKey target, source, keys and orphan policy
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: harbor-secret-key
      - equal:
          path: spec.targets[0]
          value:
            name: harbor-secret-key
            namespace: harbor
            kind: Secret
            secretType: Opaque
            creationPolicy: Orphan
            metadata:
              labels: {}
              annotations: {}
            template:
              engineVersion: v1
              data:
                secretKey: "{{ .HARBOR_SECRET_KEY.Value }}"
      - equal:
          path: spec.sources[0]
          value:
            projectSlug: fake-project
            environmentSlug: fake-env
            secretPath: /harbor/app
            recursive: true
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
  - it: preserves the registrySecret target, source, keys and orphan policy
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: harbor-registry-secret-v1
      - equal:
          path: spec.targets[0]
          value:
            name: harbor-registry-secret-v1
            namespace: harbor
            kind: Secret
            secretType: Opaque
            creationPolicy: Orphan
            metadata:
              labels: {}
              annotations: {}
            template:
              engineVersion: v1
              data:
                REGISTRY_HTPASSWD: "{{ .HARBOR_REGISTRY_HTPASSWD.Value }}"
                REGISTRY_PASSWD: "{{ .HARBOR_REGISTRY_PASSWD.Value }}"
      - equal:
          path: spec.sources[0]
          value:
            projectSlug: fake-project
            environmentSlug: fake-env
            secretPath: /harbor/registry
            recursive: true
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
  - it: preserves the s3Secret target, source, keys and orphan policy
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 3
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: harbor-s3-secret
      - equal:
          path: spec.targets[0]
          value:
            name: harbor-s3-secret
            namespace: harbor
            kind: Secret
            secretType: Opaque
            creationPolicy: Orphan
            metadata:
              labels: {}
              annotations: {}
            template:
              engineVersion: v1
              data:
                REGISTRY_STORAGE_S3_ACCESSKEY: "{{ .AWS_ACCESS_KEY_ID.Value }}"
                REGISTRY_STORAGE_S3_SECRETKEY: "{{ .AWS_SECRET_ACCESS_KEY.Value }}"
      - equal:
          path: spec.sources[0]
          value:
            projectSlug: fake-project
            environmentSlug: fake-env
            secretPath: /minio/users/longhorn
            recursive: true
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
  - it: cuts the helm.sh/chart label to 63 characters for long CI versions
    chart:
      version: 1.0.1-feature-devsecops-42-0123456-89abcde-1-and-a-long-tail
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: harbor-1.0.1-feature-devsecops-42-0123456-89abcde-1-and-a-long
